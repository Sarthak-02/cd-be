service: default

runtime: nodejs20

instance_class: F1

env_variables:
  NODE_ENV: "production"

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 50

handlers:
- url: /.*
  script: auto
  secure: always

entrypoint: node server.default.js
